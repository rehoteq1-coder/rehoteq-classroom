<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rehoteq Classroom - Teacher</title>
<style>
:root{--bg:#f6f8f7;--card:#fff;--ink:#1b1f23;--mute:#5b6470;--green:#0b5d3b;--gold:#c8961e;--soft:#eaf3ee;--line:#d9e2dc}
@media (prefers-color-scheme:dark){:root{--bg:#101613;--card:#18211c;--ink:#e8efe9;--mute:#9aa7a0;--green:#3cb27a;--soft:#1e2b24;--line:#2b3a32}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,Arial,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}h1{color:var(--green);font-size:22px;margin:0 0 12px}h2{color:var(--green);font-size:16px;margin:18px 0 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--soft);border-radius:12px;padding:10px;text-align:center}.kpi b{display:block;font-size:22px;color:var(--green)}
button,select,input{font:inherit;border-radius:10px;border:1px solid var(--line);padding:10px 12px;background:var(--card);color:var(--ink)}
button{background:var(--green);color:#fff;border:0;font-weight:700;cursor:pointer}button.alt{background:var(--soft);color:var(--green);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}th{background:var(--soft);color:var(--green)}
.mute{color:var(--mute);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style></head><body><div class="wrap"><h1>Rehoteq Classroom: Teacher dashboard</h1><div id="root" class="mute">Loading...</div></div>
<script type="module">
const cfg={apiKey:"AIzaSyAZ12xbUzdzc_5L5JY6d3AlIvPxLKB60TA",authDomain:"rehoteq-classroom.firebaseapp.com",projectId:"rehoteq-classroom",appId:"1:773863865025:web:8b11f1cd911e9cf05b3240"};
const TOTAL=13,B="https://www.gstatic.com/firebasejs/10.12.2/",root=document.getElementById("root");
const $=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
let A,Au,F,auth,db;
try{[A,Au,F]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
  const app=A.initializeApp(cfg);auth=Au.getAuth(app);db=F.getFirestore(app);
  Au.onAuthStateChanged(auth,u=>u?load():loginView())}catch(e){root.textContent="Could not load. This page needs internet."}
function loginView(m){
  root.replaceChildren();const c=$("div","card");c.append($("p","mute","Teacher login (your account must be added as an admin)."));
  const em=$("input");em.type="email";em.placeholder="Email";em.style.cssText="width:100%;margin:4px 0";
  const pw=$("input");pw.type="password";pw.placeholder="Password";pw.style.cssText="width:100%;margin:4px 0";
  const msg=$("div","mute",m||""),go=$("button","","Log in");
  go.onclick=async()=>{msg.textContent="Please wait...";try{await Au.signInWithEmailAndPassword(auth,em.value.trim(),pw.value)}catch(e){msg.textContent="Wrong email or password, or no network."}};
  c.append(em,pw,msg,go);root.append(c)}
function tbl(head,rows){const t=$("table"),h=t.createTHead().insertRow();head.forEach(x=>h.append(Object.assign($("th"),{textContent:x})));
  const b=t.createTBody();rows.forEach(r=>{const tr=b.insertRow();r.forEach(x=>{tr.insertCell().textContent=x})});
  const w=$("div");w.style.overflowX="auto";w.append(t);return w}
function csv(rows){const q=v=>{v=String(v);if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'};return rows.map(r=>r.map(q).join(",")).join("\n")}
async function load(){
  root.textContent="Loading...";
  try{
    const g=n=>F.getDocs(F.collection(db,n));
    const [rs,us,ls,cf]=await Promise.all([F.getDocs(F.query(F.collection(db,"results"),F.orderBy("takenAt","desc"),F.limit(500))),g("users"),g("learners"),F.getDoc(F.doc(db,"config","classroom"))]);
    const P={};us.forEach(d=>{const x=d.data();P[d.id]={email:x.email||"",lessons:(x.done||[]).length}});
    ls.forEach(d=>{P[d.id]=Object.assign(P[d.id]||{email:"",lessons:0},d.data())});
    const res=[];rs.forEach(d=>{const x=d.data();res.push({uid:x.uid,quiz:x.quiz,score:x.score,total:x.total,pct:x.pct,grade:x.grade,at:new Date(x.takenAt)})});
    draw(P,res,cf.exists()?cf.data():{})
  }catch(e){root.replaceChildren();const c=$("div","card");c.append($("p","",e.code==="permission-denied"?"This account is not an admin yet. Add its UID to the admins collection in Firestore.":"Could not load. Check your network and try again."));
    const o=$("button","alt","Log out");o.onclick=()=>Au.signOut(auth);c.append(o);root.append(c)}}
function dl(name,text){const b=new Blob([text],{type:"text/csv"}),a=$("a");a.href=URL.createObjectURL(b);a.download=name;document.body.append(a);a.click();a.remove()}
function draw(P,res,cfg){
  root.replaceChildren();const ids=Object.keys(P),nm=u=>u?(u.name||u.email||"?"):"?";
  const avg=res.length?Math.round(res.reduce((s,r)=>s+r.pct,0)/res.length):0;
  const k=$("div","kpis");[[ids.length,"Learners"],[res.length,"Quiz attempts"],[avg+"%","Average score"]].forEach(([n,l])=>{const d=$("div","kpi");d.append($("b","",n),$("span","mute",l));k.append(d)});root.append(k);
  const cc=$("div","card");cc.append($("h2","","Class settings (shown on every learner's dashboard)"));
  const mk=(ph,v)=>{const i=$("input");i.placeholder=ph;i.value=v||"";i.style.cssText="width:100%;margin:4px 0";return i};
  const nx=mk("Next class, e.g. Sat 10am - HTML lesson",cfg.next),lk=mk("Zoom or Meet link (https://...)",cfg.link),nt=mk("Announcement (optional)",cfg.note);
  const sv=$("button","","Save class settings"),sm=$("span","mute","");sm.style.marginLeft="8px";
  sv.onclick=async()=>{const l=lk.value.trim();if(l&&!l.startsWith("https://")){sm.textContent="Link must start with https://";return}
    try{await F.setDoc(F.doc(db,"config","classroom"),{next:nx.value.trim(),link:l,note:nt.value.trim(),updatedAt:Date.now()});sm.textContent="Saved."}catch(e){sm.textContent="Could not save."}};
  cc.append(nx,lk,nt,sv,sm);root.append(cc);
  const top=$("div","row");top.style.margin="12px 0";
  const sel=$("select");["All quizzes",...new Set(res.map(r=>r.quiz))].forEach(v=>sel.append(new Option(v,v)));
  const ex=$("button","","Export results"),el2=$("button","","Export learners"),rf=$("button","alt","Refresh"),lo=$("button","alt","Log out");
  rf.onclick=load;lo.onclick=()=>Au.signOut(auth);top.append(sel,ex,el2,rf,lo);root.append(top);
  root.append($("h2","","Learners"));
  const per={};res.forEach(r=>{(per[r.uid]=per[r.uid]||[]).push(r.pct)});
  const av=id=>per[id]?Math.round(per[id].reduce((a,b)=>a+b,0)/per[id].length)+"%":"-";
  const L=ids.map(id=>[nm(P[id]),P[id].phone||"",P[id].email||"",P[id].track||"",P[id].mode||"",P[id].goal||"",Math.round(P[id].lessons/TOTAL*100)+"%",(per[id]||[]).length,av(id)]);
  const fs=mk("Search learners by name, phone or email","");const lb=$("div");const HD=["Name","Phone","Email","Track","Attending","Goal","Lessons","Quizzes","Avg"];const showL=()=>{const q=fs.value.toLowerCase();lb.replaceChildren(tbl(HD,L.filter(r=>r.join(" ").toLowerCase().includes(q))))};fs.oninput=showL;root.append(fs,lb);showL();
  root.append($("h2","","Quiz results"));const box=$("div");root.append(box);
  const rows=()=>res.filter(r=>sel.value==="All quizzes"||r.quiz===sel.value);
  const show=()=>box.replaceChildren(tbl(["Learner","Quiz","Score","%","Grade","Date"],rows().map(r=>[nm(P[r.uid]),r.quiz,r.score+"/"+r.total,r.pct+"%",r.grade,r.at.toLocaleString()])));
  sel.onchange=show;show();
  ex.onclick=()=>dl("rehoteq-results.csv",csv([["Learner","Email","Quiz","Score","Total","Percent","Grade","Date"],...rows().map(r=>[nm(P[r.uid]),(P[r.uid]||{}).email||"",r.quiz,r.score,r.total,r.pct,r.grade,r.at.toISOString()])]));
  el2.onclick=()=>dl("rehoteq-learners.csv",csv([["Name","Phone","Email","Track","Attending","Device","Level","Goal","Lessons done","Quizzes","Average"],...ids.map(id=>[nm(P[id]),P[id].phone||"",P[id].email||"",P[id].track||"",P[id].mode||"",P[id].device||"",P[id].level||"",P[id].goal||"",P[id].lessons,(per[id]||[]).length,av(id)])]))}
</script></body></html>

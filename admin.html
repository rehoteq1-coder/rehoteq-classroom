<script type="module">
/* =====================================================================
   Rehoteq Teacher Console
   Same Firebase data model as before — rebuilt interface.
   ===================================================================== */

const CFG = {
  apiKey: "AIzaSyAZ12xbUzdzc_5L5JY6d3AlIvPxLKB60TA",
  authDomain: "rehoteq-classroom.firebaseapp.com",
  projectId: "rehoteq-classroom",
  appId: "1:773863865025:web:8b11f1cd911e9cf05b3240"
};
/* Progress is one flat array of global lesson ids on users/{uid}.done.
   Beginner occupies 0-12, Masterclass 100-113, so a learner can hold both. */
const TRACKS = {
  Beginner:    { base: 0,   total: 13 },
  Masterclass: { base: 100, total: 14 }
};
const TRACK_KEYS = Object.keys(TRACKS);
const DEFAULT_TRACK = "Beginner";

/* How many lessons of one track this learner has finished. */
function doneIn(list, key){
  const t = TRACKS[key]; if (!t) return 0;
  let n = 0;
  for (const g of (list || [])) if (g >= t.base && g < t.base + t.total) n++;
  return n;
}
/* The track a learner should be scored against, plus their count and total. */
function trackProgress(p){
  const key = TRACKS[p.track] ? p.track : DEFAULT_TRACK;
  const counts = {};
  TRACK_KEYS.forEach(k => counts[k] = doneIn(p.doneList, k));
  // If they have progress outside their enrolled track, score the fuller one.
  let scored = key;
  TRACK_KEYS.forEach(k => { if (counts[k] > counts[scored]) scored = k; });
  return { key: scored, enrolled: key, counts,
    done: counts[scored], total: TRACKS[scored].total };
}
const SDK = "https://www.gstatic.com/firebasejs/10.12.2/";

/* ---------- tiny DOM helper ---------- */
function h(tag, props, ...kids){
  const e = document.createElement(tag);
  if (props) for (const k in props){
    const v = props[k];
    if (v === undefined || v === null || v === false) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k === "html") e.innerHTML = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e[k.toLowerCase()] = v;
    else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach(k => { if (k === null || k === undefined || k === false) return;
    e.append(k.nodeType ? k : document.createTextNode(String(k))); });
  return e;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, props, ...kids){
  const e = document.createElementNS(svgNS, tag);
  for (const k in (props||{})) if (props[k] !== undefined && props[k] !== null) e.setAttribute(k, props[k]);
  kids.flat().forEach(k => { if (k) e.append(k.nodeType ? k : document.createTextNode(String(k))); });
  return e;
}
const root = document.getElementById("root");
const chrome = document.getElementById("chrome");

/* ---------- toasts ---------- */
function toast(msg, kind){
  const host = document.getElementById("toasts");
  const t = h("div", { class: "toast" + (kind ? " " + kind : ""), text: msg });
  host.append(t);
  setTimeout(() => { t.style.transition = "opacity .3s, transform .3s";
    t.style.opacity = 0; t.style.transform = "translateY(8px)"; setTimeout(() => t.remove(), 320); }, 2800);
}

/* ---------- theme ---------- */
function currentTheme(){
  try { return JSON.parse(localStorage.getItem("rc-theme")) || "auto"; } catch(e){ return "auto"; }
}
function setTheme(v){
  try { localStorage.setItem("rc-theme", JSON.stringify(v)); } catch(e){}
  if (v === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = v;
}
function themeButton(){
  const order = ["auto", "light", "dark"];
  const icon = { auto: "◐", light: "☀", dark: "☾" };
  const b = h("button", { class: "icon-btn", title: "Theme: " + currentTheme(), "aria-label": "Change theme" });
  const paint = () => { b.textContent = icon[currentTheme()]; b.title = "Theme: " + currentTheme(); };
  b.onclick = () => { setTheme(order[(order.indexOf(currentTheme()) + 1) % 3]); paint(); };
  paint(); return b;
}

/* ---------- formatting ---------- */
const initials = n => (n || "?").trim().split(/\s+/).slice(0,2).map(w => w[0]).join("").toUpperCase() || "?";
const pctOf = (a, b) => b ? Math.round(a / b * 100) : 0;
const fmtDate = d => d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
const fmtWhen = d => d.toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
function gradeTone(g){ return /^[AB]/.test(g) ? "ok" : /^[C]/.test(g) ? "info" : /^[DE]/.test(g) ? "gold" : "bad"; }

/* ---------- state ---------- */
let A, Au, F, auth, db;
let DATA = null;                 // { people, results, config }
let nav = "overview";
let painted = false;          // first paint should not steal focus
let learnerSort = { key: "name", dir: 1 };
let learnerQuery = "";
let resultFilter = "All quizzes";

/* ---------- boot ---------- */
try {
  [A, Au, F] = await Promise.all([
    import(SDK + "firebase-app.js"),
    import(SDK + "firebase-auth.js"),
    import(SDK + "firebase-firestore.js")
  ]);
  const app = A.initializeApp(CFG);
  auth = Au.getAuth(app);
  db = F.getFirestore(app);
  chrome.append(themeButton());
  Au.onAuthStateChanged(auth, u => u ? load() : loginView());
} catch (e) {
  chrome.append(themeButton());
  root.append(h("div", { class: "wrap", style: "padding:40px 16px" },
    h("div", { class: "card" },
      h("div", { class: "empty" },
        h("div", { class: "em", text: "⛰" }),
        h("b", { text: "This console needs the internet" }),
        h("div", { class: "mute", text: "The teacher tools read live data from Firebase. Reconnect and refresh this page." })))));
}

/* =====================================================================
   LOGIN
   ===================================================================== */
function loginView(){
  chrome.replaceChildren(themeButton());
  root.replaceChildren();
  const err = h("div", { class: "err" });
  const email = h("input", { type: "email", placeholder: "you@school.com", autocomplete: "email" });
  const pass  = h("input", { type: "password", placeholder: "Your password", autocomplete: "current-password" });
  const go = h("button", { class: "btn block lg", style: "margin-top:18px" }, "Enter the console");

  const submit = async () => {
    err.textContent = "";
    if (!email.value.trim() || !pass.value) { err.textContent = "Enter your email and password."; return; }
    go.disabled = true; go.textContent = "Checking...";
    try { await Au.signInWithEmailAndPassword(auth, email.value.trim(), pass.value); }
    catch (e) {
      err.textContent = e.code === "auth/network-request-failed"
        ? "No network. Try again when you have signal."
        : "Wrong email or password.";
      go.disabled = false; go.textContent = "Enter the console";
    }
  };
  go.onclick = submit;
  [email, pass].forEach(i => i.onkeydown = ev => { if (ev.key === "Enter") submit(); });

  root.append(h("div", { class: "login-shell" },
    h("div", { class: "login-card stack rise" },
      h("div", { class: "card hero", style: "text-align:center" },
        h("div", { class: "logo", style: "margin:0 auto 12px;width:48px;height:48px;font-size:22px;border-radius:14px;background:rgba(255,255,255,.18);box-shadow:none" }, "R"),
        h("div", { class: "eyebrow", text: "Rehoteq Academy" }),
        h("h1", { text: "Teacher Console" }),
        h("p", { class: "lead", style: "margin:6px 0 0", text: "Class settings, learner progress and quiz results — in one place." })),
      h("div", { class: "card" },
        h("label", { class: "field" }, h("span", { class: "lbl", text: "Email" }), email),
        h("label", { class: "field" }, h("span", { class: "lbl", text: "Password" }), pass),
        err, go,
        h("a", { class: "btn quiet block", style: "margin-top:8px", href: "./" }, "← Back to the classroom"),
        h("p", { class: "faint", style: "margin:14px 0 0;text-align:center",
          text: "Staff only. Your account must be listed in the admins collection." })),
      h("p", { class: "faint center", text: "Rehoteq Technologies · Okitipupa, Ondo State" }))));
}

/* =====================================================================
   DATA
   ===================================================================== */
function skeleton(){
  root.replaceChildren(h("div", { class: "wrap wrap-wide", style: "padding:26px 16px" },
    h("div", { class: "grid g4", style: "margin-bottom:16px" },
      ...[0,1,2,3].map(() => h("div", { class: "kpi" },
        h("div", { class: "skel", style: "width:52px;height:26px;margin-bottom:8px" }),
        h("div", { class: "skel", style: "width:88px;height:11px" })))),
    h("div", { class: "card" },
      ...[0,1,2,3,4].map(i => h("div", { class: "skel", style: "height:17px;margin:11px 0;width:" + (100 - i*9) + "%" })))));
}

async function load(){
  skeleton();
  try {
    const all = n => F.getDocs(F.collection(db, n));
    const jobs = [
      ["results",  F.getDocs(F.query(F.collection(db, "results"), F.orderBy("takenAt", "desc"), F.limit(500)))],
      ["users",    all("users")],
      ["learners", all("learners")],
      ["config",   F.getDoc(F.doc(db, "config", "classroom"))]
    ];
    const out = await Promise.allSettled(jobs.map(j => j[1]));
    const bad = out.map((o, i) => o.status === "rejected" ? [jobs[i][0], o.reason] : null).filter(Boolean);
    if (bad.length){
      const e = new Error("load");
      e.code = bad.every(b => b[1] && b[1].code === "permission-denied") ? "permission-denied" : "other";
      e.bad = bad.map(b => b[0]);
      throw e;
    }
    const [rs, us, ls, cf] = out.map(o => o.value);

    const people = {};
    us.forEach(d => { const x = d.data(); people[d.id] = { uid: d.id, email: x.email || "", lessons: (x.done || []).length, doneList: x.done || [] }; });
    ls.forEach(d => { people[d.id] = Object.assign({ uid: d.id, email: "", lessons: 0, doneList: [] }, people[d.id], d.data()); });

    const results = [];
    rs.forEach(d => { const x = d.data();
      results.push({ uid: x.uid, quiz: x.quiz, score: x.score, total: x.total, pct: x.pct, grade: x.grade, at: new Date(x.takenAt) }); });

    DATA = { people, results, config: cf.exists() ? cf.data() : {} };
    paint();
  } catch (e) { errorView(e); }
}

function errorView(e){
  chrome.replaceChildren(themeButton());
  root.replaceChildren();
  const me = auth.currentUser;
  const card = h("div", { class: "card stack" });

  if (e.code === "permission-denied"){
    const uidBox = h("input", { class: "uid-box", readonly: true, value: me ? me.uid : "" });
    const copy = h("button", { class: "btn ghost sm" }, "Copy UID");
    copy.onclick = async () => {
      try { await navigator.clipboard.writeText(uidBox.value); toast("UID copied", "ok"); }
      catch (x) { uidBox.select(); toast("Select and copy the UID"); }
    };
    card.append(
      h("div", { class: "callout bad" }, h("div", null,
        h("b", { text: "Access denied" }), " on: " + (e.bad || []).join(", ") + ".")),
      h("h2", { text: "Two things to check" }),
      h("ol", { class: "prose" },
        h("li", { text: "Firestore → the admins collection must have a document whose ID is exactly the UID below." }),
        h("li", { text: "The latest security rules from the README must be published (they need isAdmin, learners and config)." })),
      h("p", { class: "mute", text: "Signed in as " + (me ? me.email : "unknown") + ". Your UID:" }),
      uidBox,
      h("div", { class: "row" }, copy,
        h("a", { class: "btn ghost sm", href: "./" }, "Back to the classroom"),
        logoutButton("btn quiet sm")));
  } else {
    card.append(h("div", { class: "empty" },
      h("div", { class: "em", text: "⚡" }),
      h("b", { text: "Could not load the classroom" }),
      h("div", { class: "mute", text: "Check your network and try again." })),
      h("div", { class: "row" },
        h("button", { class: "btn", onclick: load }, "Try again"), logoutButton("btn quiet")));
  }
  root.append(h("div", { class: "wrap", style: "padding:32px 16px" }, card));
}

function logoutButton(cls){
  return h("button", { class: cls || "btn quiet", onclick: () => Au.signOut(auth) }, "Log out");
}

/* =====================================================================
   SHELL
   ===================================================================== */
function paint(){
  const { people, results } = DATA;
  const ids = Object.keys(people);

  chrome.replaceChildren(
    h("button", { class: "icon-btn", title: "Refresh data", "aria-label": "Refresh", onclick: () => { toast("Refreshing..."); load(); } }, "⟳"),
    themeButton(),
    h("button", { class: "btn ghost sm", onclick: () => Au.signOut(auth) }, "Log out")
  );

  const views = {
    overview: ["◈", "Overview", ""],
    learners: ["◎", "Learners", String(ids.length)],
    results:  ["◇", "Results",  String(results.length)],
    settings: ["✦", "Class settings", ""]
  };
  const side = h("nav", { class: "side" });
  Object.entries(views).forEach(([key, [ic, label, cnt]]) => {
    side.append(h("button", { class: "navlink" + (nav === key ? " on" : ""), onclick: () => { nav = key; paint(); window.scrollTo({ top: 0 }); } },
      h("span", { class: "ni", text: ic }), h("span", { text: label }), cnt ? h("span", { class: "cnt", text: cnt }) : null));
  });

  const body = h("main", { class: "fade" });
  if (nav === "overview") body.append(...overviewView());
  if (nav === "learners") body.append(...learnersView());
  if (nav === "results")  body.append(...resultsView());
  if (nav === "settings") body.append(...settingsView());
  document.title = views[nav][1] + " · Teacher Console";

  root.replaceChildren(h("div", { class: "wrap wrap-wide console" },
    h("aside", { class: "rail" },
      h("div", { class: "card pad-sm" }, side),
      h("div", { class: "card pad-sm rail-foot" },
        h("div", { class: "eyebrow", text: "Signed in" }),
        h("div", { class: "row row-tight", style: "margin-top:8px;flex-wrap:nowrap" },
          h("span", { class: "avatar sm", text: initials(auth.currentUser?.email) }),
          h("span", { class: "mute", style: "font-size:12px;overflow:hidden;text-overflow:ellipsis",
            text: auth.currentUser ? auth.currentUser.email : "" })))),
    body));
  if (painted){ const hd = body.querySelector("h1"); if (hd){ hd.setAttribute("tabindex","-1"); try{ hd.focus({preventScroll:true}); }catch(e){} } }
  painted = true;
}

/* ---------- shared derivations ---------- */
function derive(){
  const { people, results } = DATA;
  const ids = Object.keys(people);
  const perLearner = {};
  results.forEach(r => (perLearner[r.uid] = perLearner[r.uid] || []).push(r));
  const avgFor = id => perLearner[id]?.length
    ? Math.round(perLearner[id].reduce((s, r) => s + r.pct, 0) / perLearner[id].length) : null;
  const avgAll = results.length ? Math.round(results.reduce((s, r) => s + r.pct, 0) / results.length) : 0;
  const completion = ids.length
    ? Math.round(ids.reduce((s, id) => {
        const t = trackProgress(people[id]);
        return s + Math.min(1, t.total ? t.done / t.total : 0);
      }, 0) / ids.length * 100) : 0;
  const byTrack = {};
  TRACK_KEYS.forEach(k => byTrack[k] = ids.filter(id => trackProgress(people[id]).enrolled === k).length);
  const active7 = new Set(results.filter(r => Date.now() - r.at.getTime() < 7 * 864e5).map(r => r.uid)).size;
  return { ids, perLearner, avgFor, avgAll, completion, active7, byTrack };
}

/* =====================================================================
   VIEW · OVERVIEW
   ===================================================================== */
function overviewView(){
  const { people, results, config } = DATA;
  const { ids, avgAll, completion, active7, perLearner, avgFor, byTrack } = derive();

  const head = h("header", { class: "view-head" },
    h("div", { class: "eyebrow", text: "Today · " + new Date().toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }) }),
    h("h1", { text: "How the class is doing" }),
    h("p", { class: "mute", text: "Live from Firebase. Last 500 quiz attempts." }));

  const kpis = h("section", { class: "grid g4 rise" },
    kpi(ids.length, "Learners enrolled", (active7 + " active this week"), ""),
    kpi(completion + "%", "Average course completion", TRACK_KEYS.map(k => byTrack[k] + " " + k).join(" · "), "gold"),
    kpi(results.length, "Quiz attempts", "recorded", "sky"),
    kpi(avgAll + "%", "Average quiz score", avgAll >= 50 ? "class is passing" : "needs support", avgAll >= 50 ? "" : "clay"));

  /* per-quiz averages */
  const byQuiz = {};
  results.forEach(r => { (byQuiz[r.quiz] = byQuiz[r.quiz] || []).push(r.pct); });
  const quizKeys = Object.keys(byQuiz).sort();
  const quizData = quizKeys.map(k => ({
    label: k,
    value: Math.round(byQuiz[k].reduce((a, b) => a + b, 0) / byQuiz[k].length),
    n: byQuiz[k].length
  }));

  const chartCard = h("div", { class: "card rise rise-1" },
    h("div", { class: "card-title" }, h("h2", { text: "Average score per quiz" }),
      h("span", { class: "pill ghost", text: quizKeys.length + " quizzes attempted" })),
    quizData.length ? barChart(quizData)
      : h("div", { class: "empty" }, h("div", { class: "em", text: "◇" }), h("b", { text: "No attempts yet" }),
          h("div", { class: "mute", text: "Charts appear as soon as learners take a quiz." })));

  /* weakest topic callout */
  let insight = null;
  if (quizData.length){
    const worst = quizData.slice().sort((a, b) => a.value - b.value)[0];
    const best  = quizData.slice().sort((a, b) => b.value - a.value)[0];
    insight = h("div", { class: "callout " + (worst.value < 50 ? "warn" : "ok"), style: "margin-top:14px" },
      h("div", null, h("b", { text: worst.value < 50 ? "Revisit " + worst.label : "Strongest: " + best.label + " (" + best.value + "%)" }),
        h("div", { style: "margin-top:2px" },
          worst.value < 50
            ? "Learners average " + worst.value + "% here — the lowest in the class. Worth a live recap."
            : "Lowest is " + worst.label + " at " + worst.value + "%. No topic is failing.")));
    chartCard.append(insight);
  }

  /* activity last 14 days */
  const days = [];
  for (let i = 13; i >= 0; i--){
    const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - i);
    const next = d.getTime() + 864e5;
    days.push({ label: fmtDate(d), value: results.filter(r => r.at >= d && r.at < next).length });
  }
  const activityCard = h("div", { class: "card rise rise-2" },
    h("div", { class: "card-title" }, h("h2", { text: "Quiz activity" }),
      h("span", { class: "pill ghost", text: "last 14 days" })),
    sparkline(days));

  /* top learners */
  const ranked = ids.map(id => ({
    id, p: people[id],
    lessons: (t => pctOf(t.done, t.total))(trackProgress(people[id])),
    avg: avgFor(id),
    attempts: (perLearner[id] || []).length
  })).sort((a, b) => (b.lessons + (b.avg || 0)) - (a.lessons + (a.avg || 0))).slice(0, 5);

function kpi(value, label, sub, tone){
  return h("div", { class: "kpi " + (tone || "") },
    h("b", { class: "num", text: String(value) }),
    h("span", { text: label }),
    sub ? h("div", { class: "kpi-sub", text: sub }) : null);
}

function barChart(data){
  const W = 100 * data.length + 40, H = 210, pad = 30, bw = 52, gap = 100 - bw;
  // Fixed pixel size inside a horizontally scrolling box: text and bars never distort.
  const g = s("svg", { class: "chart", viewBox: "0 0 " + W + " " + H, width: W, height: H,
    style: "height:" + H + "px;width:" + W + "px;max-width:none",
    role: "img", "aria-label": "Average score per quiz" });
  [0, 25, 50, 75, 100].forEach(v => {
    const y = H - pad - (v / 100) * (H - pad - 18);
    g.append(s("line", { class: "gridline", x1: 26, y1: y, x2: W, y2: y, "stroke-dasharray": v ? "3 5" : "" }));
    g.append(s("text", { class: "lbl", x: 0, y: y + 3.5 }, v + "%"));
  });
  data.forEach((d, i) => {
    const x = 34 + i * 100 + gap / 2;
    const bh = Math.max(3, (d.value / 100) * (H - pad - 18));
    const y = H - pad - bh;
    const r = s("rect", { class: "barr", x, y, width: bw, height: bh, rx: 8 });
    r.append(s("title", null, d.label + ": " + d.value + "% from " + d.n + " attempt" + (d.n === 1 ? "" : "s")));
    g.append(r);
    g.append(s("text", { class: "valn", x: x + bw / 2, y: y - 6, "text-anchor": "middle" }, d.value + "%"));
    g.append(s("text", { class: "lbl", x: x + bw / 2, y: H - pad + 15, "text-anchor": "middle" }, d.label));
  });
  const box = h("div", { style: "overflow-x:auto" }); box.append(g); return box;
}

function sparkline(days){
  const W = 640, H = 160, pad = 24;
  const max = Math.max(1, ...days.map(d => d.value));
  const step = (W - pad * 2) / (days.length - 1);
  const pt = i => [pad + i * step, H - pad - (days[i].value / max) * (H - pad * 2)];
  const line = days.map((_, i) => pt(i).map(n => n.toFixed(1)).join(",")).join(" ");
  const area = "M" + pad + "," + (H - pad) + " L" + line.split(" ").join(" L") + " L" + (W - pad) + "," + (H - pad) + " Z";
  // Scales proportionally with the card, so the dots stay round on every screen.
  const g = s("svg", { class: "chart", viewBox: "0 0 " + W + " " + H, style: "width:100%;height:auto",
    role: "img", "aria-label": "Quiz attempts over the last 14 days" });
  const grad = s("linearGradient", { id: "spark", x1: 0, y1: 0, x2: 0, y2: 1 });
  grad.append(s("stop", { offset: "0%", "stop-color": "#2aa374", "stop-opacity": .38 }));
  grad.append(s("stop", { offset: "100%", "stop-color": "#2aa374", "stop-opacity": 0 }));
  g.append(s("defs", null, grad));
  g.append(s("path", { d: area, fill: "url(#spark)" }));
  g.append(s("polyline", { points: line, fill: "none", stroke: "#12855a", "stroke-width": 2.4,
    "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" }));
  days.forEach((d, i) => { const [x, y] = pt(i);
    const c = s("circle", { cx: x, cy: y, r: d.value ? 3.4 : 2, fill: d.value ? "#12855a" : "#c3d5c9" });
    c.append(s("title", null, d.label + ": " + d.value + " attempt" + (d.value === 1 ? "" : "s"))); g.append(c); });
  return h("div", null, g,
    h("div", { class: "spread faint", style: "margin-top:4px" },
      h("span", { text: days[0].label }), h("span", { text: days[days.length - 1].label })));
}

  const cols = [
    ["name", "Learner"], ["track", "Track"], ["mode", "Attending"],
    ["lessons", "Lessons"], ["quizzes", "Quizzes"], ["avg", "Average"], ["phone", "Phone"]
  ];

  function visible(){
    const q = learnerQuery.trim().toLowerCase();
    let out = rows.filter(r => !q || [r.name, r.phone, r.email, r.goal, r.track].join(" ").toLowerCase().includes(q));
    const { key, dir } = learnerSort;
    out.sort((a, b) => {
      const x = a[key], y = b[key];
      const na = x === null ? -1 : x, nb = y === null ? -1 : y;
      if (typeof na === "number" && typeof nb === "number") return (na - nb) * dir;
      return String(na).localeCompare(String(nb)) * dir;
    });
    return out;
  }

  function drawTable(){
    const list = visible();
    if (!list.length){
      tableHost.replaceChildren(h("div", { class: "card" }, h("div", { class: "empty" },
        h("div", { class: "em", text: "◎" }),

      return;

    const thead = h("thead"), tr = h("tr");
    cols.forEach(([key, label]) => {
      const on = learnerSort.key === key;
      tr.append(h("th", { class: "sortable", scope: "col", role: "columnheader",
        "aria-sort": on ? (learnerSort.dir > 0 ? "ascending" : "descending") : "none",
        onclick: () => {
        learnerSort = { key, dir: on ? -learnerSort.dir : (typeof rows[0][key] === "number" ? -1 : 1) }; drawTable();
      } }, label, h("span", { class: "arrow", text: on ? (learnerSort.dir > 0 ? "▲" : "▼") : "↕" })));
    });
    thead.append(tr);
    const tbody = h("tbody");
    list.forEach(r => {
      tbody.append(h("tr", { style: "cursor:pointer", onclick: () => openLearner(r.id) },
        h("td", { class: "strong" }, h("span", { class: "cell-user" },
          h("span", { class: "avatar sm", text: initials(r.name) }),
          h("span", null, r.name))),
        h("td", null, h("span", { class: "pill ghost", text: r.track })),
        h("td", { text: r.mode }),
        h("td", null, h("span", { class: "mini-bar", role: "progressbar", "aria-valuenow": r.lessons,
            "aria-valuemin": "0", "aria-valuemax": "100", "aria-label": "Lessons complete" },
            h("i", { style: "width:" + r.lessons + "%" })),
          h("span", { class: "num", style: "margin-left:8px;font-weight:650", text: r.lessons + "%" })),
        h("td", { class: "num", text: String(r.quizzes) }),

        h("td", { class: "mute", text: r.phone || "—" })));
    });
    tableHost.replaceChildren(h("div", { class: "tbl-wrap" }, h("table", null, thead, tbody)),
      h("p", { class: "faint", style: "margin-top:8px", text: list.length + " of " + rows.length + " learners · tap a row for the full record" }));
  }

  search.oninput = () => { learnerQuery = search.value; drawTable(); };
  exportBtn.onclick = () => {
    const list = visible();
    download("rehoteq-learners.csv", toCSV([
      ["Name","Phone","Email","Track","Attending","Device","Level","Goal","Lessons %","Scored track","Quizzes","Average %"],
      ...list.map(r => [r.name, r.phone, r.email, r.track, r.mode, r.device, r.level, r.goal, r.lessons, r.scored, r.quizzes, r.avg === null ? "" : r.avg])
    ]));
    toast("Exported " + list.length + " learners", "ok");
  };
  drawTable();

  return [
    h("header", { class: "view-head spread" },
      h("div", null, h("h1", { text: "Learners" }),

      exportBtn),

    tableHost
  ];

/* =====================================================================
   CSV
   ===================================================================== */
function toCSV(rows){
  const q = v => { v = v === null || v === undefined ? "" : String(v);
    if (/^[=+\-@]/.test(v)) v = "'" + v;          // spreadsheet injection guard
    return '"' + v.replace(/"/g, '""') + '"'; };
  return "\uFEFF" + rows.map(r => r.map(q).join(",")).join("\r\n");
}
function download(name, text){
  const blob = new Blob([text], { type: "text/csv;charset=utf-8" });
  const a = h("a", { href: URL.createObjectURL(blob), download: name });
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ---------- sticky header shadow ---------- */
const bar = document.getElementById("topbar");
addEventListener("scroll", () => bar.classList.toggle("stuck", scrollY > 6), { passive: true });
</script>
</body>

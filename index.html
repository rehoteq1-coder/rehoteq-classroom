/* ---------- DOM helper ---------- */
function h(tag,props){
  var e=document.createElement(tag), i, k;
  if(props) for(k in props){
    var v=props[k];
    if(v===undefined||v===null||v===false) continue;
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k==="style") e.style.cssText=v;
    else if(k.slice(0,2)==="on") e[k.toLowerCase()]=v;
    else e.setAttribute(k, v===true?"":v);
  }
  for(i=2;i<arguments.length;i++) add(e,arguments[i]);
  return e;
}
function add(parent,kid){
  if(kid===null||kid===undefined||kid===false) return;
  if(Array.isArray(kid)){kid.forEach(function(k){add(parent,k)});return}
  parent.append(kid.nodeType?kid:document.createTextNode(String(kid)));
}
var NS="http://www.w3.org/2000/svg";
function sv(tag,props){
  var e=document.createElementNS(NS,tag),k;
  for(k in (props||{})) if(props[k]!==undefined&&props[k]!==null) e.setAttribute(k,props[k]);
  for(var i=2;i<arguments.length;i++) if(arguments[i]) e.append(arguments[i]);
  return e;
}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

/* ---------- progress ring ---------- */
function ring(value,size,label,sub,gold){
  size=size||88;
  var r=(size-11)/2, c=2*Math.PI*r, off=c*(1-Math.min(100,value)/100);
  var g=sv("svg",{class:"ring",width:size,height:size,viewBox:"0 0 "+size+" "+size,"aria-hidden":"true"});

function say(m){syncMsg=m;var e=document.getElementById("sync");if(e)e.textContent=m}
function sync(){
  syncResults();pushProfile();
  if(!fb||!user)return;
  if(!navigator.onLine){say(dirty?"Saved on this phone. Will sync when online.":"");return}
  say("Syncing...");
  var ref=fb.doc(fb.db,"users",user.uid);
  var slow=new Promise(function(_,r){setTimeout(function(){r(new Error("slow"))},15000)});
  Promise.race([fb.getDoc(ref),slow]).then(function(snap){
    var c=snap.exists()?snap.data():null;
    if(c&&c.updatedAt>stamp){done=c.done||[];stamp=c.updatedAt;dirty=false;set(K,done);set(K+"-t",stamp);set(K+"-d",false);render()}
    else if(dirty||!c){return Promise.race([fb.setDoc(ref,{done:done,updatedAt:stamp,email:user.email||""}),slow])
      .then(function(){dirty=false;set(K+"-d",false)})}
  }).then(function(){say("All progress saved online")}).catch(function(){say("Saved on this phone. Will retry.")});
}
function syncResults(){
  function m(t){var e=document.getElementById("qsync");if(e)e.textContent=t}
  if(!outbox.length){m("Result saved online.");return}
  if(!CONFIGURED||!fb||!user){m(CONFIGURED?"Saved on this phone. Log in to save it online.":"Saved on this phone.");return}
  if(!navigator.onLine){m("Saved on this phone. Will send when you are online.");return}
  if(sending)return;
  sending=true;m("Sending to your teacher...");
  var item=null,data={},k;
  outbox.forEach(function(x){if(!item&&(x.owner==null||x.owner===user.uid))item=x});
  if(!item){sending=false;m("Result saved online.");return}
  for(k in item) if(k!=="owner") data[k]=item[k];
  data.uid=user.uid;
  var slow=new Promise(function(_,rj){setTimeout(function(){rj(new Error("slow"))},15000)});
  Promise.race([fb.setDoc(fb.doc(fb.db,"results",item.id),data),slow]).then(function(){
    outbox=outbox.filter(function(x){return x.id!==item.id});set(OK,outbox);sending=false;syncResults();
  }).catch(function(){sending=false;m("Saved on this phone. Will retry.")});
}

  var head=h("div",{class:"quiz-head"},
    h("div",{class:"spread"},
      h("div",null,h("div",{class:"eyebrow",text:Q.name}),
        h("div",{class:"mute",style:"font-weight:650",text:"Question "+(session.i+1)+" of "+n})),
      h("span",{class:"timer",id:"tm",role:"timer","aria-live":"off","aria-label":"Time remaining",text:"⏱ --:--"})),
    h("div",{class:"segs",style:"margin-top:10px",role:"img",
      "aria-label":"Answered "+answered+" of "+n+" questions"},
      session.order.map(function(o,j){
        return h("span",{class:j===session.i?"cur":(session.ans[o.q]!==undefined?"on":"")});
      })));
  app.append(head);

  var c=h("div",{class:"card rise"});
  c.append(h("h1",{style:"font-size:20px;line-height:1.35",text:q.t}));
  var keys="ABCDE";
  it.o.forEach(function(oi,pos){
    var on=session.ans[it.q]===oi;
    c.append(h("button",{class:"opt"+(on?" on":""),"aria-pressed":on?"true":"false",onclick:function(){
      session.ans[it.q]=oi;set(SK,session);
      if(session.i<n-1){session.i++;set(SK,session)}
      showQuiz();
    }},h("span",{class:"key",text:keys[pos]}),h("span",{text:q.o[oi]})));
  });
  app.append(c);

  var left=n-answered, isLast=session.i===n-1;
  var prev=h("button",{class:"btn ghost",style:"flex:1",disabled:session.i===0,
    onclick:function(){session.i--;set(SK,session);showQuiz()}},"← Back");
  var nextBtn=h("button",{class:"btn",style:"flex:2",
    onclick:function(){if(isLast)confirmFinish(left);else{session.i++;set(SK,session);showQuiz()}}},
    isLast?("Submit"+(left?" ("+left+" left)":"")):"Next →");
  app.append(h("div",{class:"row",style:"margin-top:12px;flex-wrap:nowrap"},prev,nextBtn));
  app.append(h("button",{class:"btn quiet block",style:"margin-top:8px",
    onclick:function(){clearInterval(tick);tab="quiz";home()}},"Leave (timer keeps running)"));
  runTimer();
  land(Q.name+" quiz, question "+(session.i+1));
}
function confirmFinish(left){
  if(!left){finish();return}
  if(confirm(left+" question"+(left===1?" is":"s are")+" unanswered. Submit anyway?")) finish();
}
function finish(){
  clearInterval(tick);
  if(!session)return;
  var Q=ALLQZ[session.key], sc=0;
  session.order.forEach(function(it){if(session.ans[it.q]===Q.q[it.q].a)sc++});
  var tot=Q.q.length, p=Math.round(sc/tot*100);
  var r={id:session.id,quiz:session.key,score:sc,total:tot,pct:p,grade:gradeOf(p),takenAt:Date.now(),ans:session.ans,order:session.order};
  results.unshift(r);results=results.slice(0,20);set(RK,results);
  outbox.push({id:r.id,quiz:r.quiz,score:r.score,total:r.total,pct:r.pct,grade:r.grade,takenAt:r.takenAt,owner:user?user.uid:null});
  set(OK,outbox);
  session=null;try{localStorage.removeItem(SK)}catch(e){}
  showResult(r);
  syncResults();
  if(p>=70) confetti();
}
function showResult(r){
  lastR=r;view="result";app.replaceChildren();showTabs(false);window.scrollTo(0,0);
  var Q=ALLQZ[r.quiz];
  var verdict=r.pct>=75?"Excellent. You have this.":r.pct>=50?"Solid pass. Review the misses below.":"Not yet — reread the lesson and try again.";

  var hero=h("div",{class:"card hero score-hero rise"},
    h("div",{class:"eyebrow",text:Q.name}),
    ring(r.pct,148,r.pct+"%",null,true),
    h("h1",{style:"font-size:26px",text:r.score+" of "+r.total+" correct"}),
    h("div",{class:"row",style:"justify-content:center;margin-top:10px"},
      h("span",{class:"pill on-dark",text:"Grade "+r.grade})),
    h("p",{class:"lead",style:"margin-top:12px",text:verdict}),
    h("div",{class:"mute",id:"qsync",style:"margin-top:8px;font-size:12.5px",text:"Saved on this phone."}));
  app.append(hero);

  var rv=h("div",{class:"card rise rise-1"},h("div",{class:"card-title"},h("h2",{text:"Review every question"})));
  (r.order||[]).forEach(function(it,i){
    var q=Q.q[it.q], mine=r.ans[it.q], ok=mine===q.a;
    var d=h("div",{class:"review-q"});
    d.append(h("span",{class:"qt"},h("span",{class:"mark "+(ok?"y":"n"),text:ok?"✓":"✕"}),(i+1)+". "+q.t));
    d.append(h("div",{class:"mute",text:(ok?"Your answer: ":"You chose: ")+(mine===undefined?"(no answer)":q.o[mine])}));
    if(!ok) d.append(h("div",{style:"color:var(--ok);font-weight:650;font-size:14px",text:"Correct: "+q.o[q.a]}));
    d.append(h("div",{class:"callout",style:"margin-top:8px"},h("div",{text:q.e})));
    rv.append(d);
  });
  app.append(rv);

  app.append(h("div",{class:"row",style:"margin-top:12px;flex-wrap:nowrap"},
    h("button",{class:"btn",style:"flex:1",onclick:function(){startQuiz(r.quiz)}},"Try again"),
    h("button",{class:"btn ghost",style:"flex:1",onclick:function(){tab="quiz";home()}},"All quizzes")));
  land("Result: "+r.score+" of "+r.total);
  syncResults();
}
function confetti(){
  try{ if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion:reduce)").matches)return }catch(e){ return }
  try{ confettiBurst() }catch(e){}
}
function confettiBurst(){
  var box=h("div",{class:"confetti"}), colors=["#12855a","#e2ad34","#2aa374","#f3cd74","#b4552f"];
  for(var i=0;i<42;i++){
    var p=h("i",{style:"left:"+Math.random()*100+"%;top:-20px;background:"+colors[i%colors.length]+
      ";animation-duration:"+(1.6+Math.random()*1.4)+"s;animation-delay:"+(Math.random()*.5)+"s;"+
      "transform:rotate("+Math.random()*360+"deg)"});
    box.append(p);
  }
  document.body.append(box);
  setTimeout(function(){box.remove()},3600);
}

/* =====================================================================
   ONBOARDING — three calm steps instead of one long form
   ===================================================================== */
var STEPS=[
  {title:"Who are you?",note:"So your teacher knows who is in the room.",
   fields:[["name","Full name","text","Your full name"],["phone","Phone or WhatsApp","tel","e.g. 08012345678"]]},
  {title:"How will you learn?",note:"This shapes the reminders you get.",
   fields:[["track","Track","select",["Beginner","Masterclass"]],
           ["mode","How will you attend?","select",["In person (Okitipupa)","Online (Zoom or Google Meet)","Both"]],
           ["device","Device you will learn on","select",["Phone","Laptop","Both"]]]},
  {title:"Where are you going?",note:"We use this to suggest the right projects.",
   fields:[["level","Your experience","select",["Complete beginner","Some experience","I already build projects"]],
           ["goal","Main goal","select",["Get skills for a job","Freelance and earn","School or church project","Start my own business","Just learning"]]]}
];
function showOnboarding(){
  view="onboard";app.replaceChildren();showTabs(false);window.scrollTo(0,0);
  var step=STEPS[onboardStep];

  var head=h("div",{class:"card hero rise",style:"margin-top:16px"},
    h("div",{class:"eyebrow",text:"Step "+(onboardStep+1)+" of "+STEPS.length}),
    h("h1",{text:step.title}),
    h("p",{class:"lead",style:"margin:4px 0 0",text:step.note}),
    h("div",{class:"segs",style:"margin-top:16px"},
      STEPS.map(function(_,j){return h("span",{class:j<=onboardStep?"on":"",
        style:j<=onboardStep?"background:linear-gradient(90deg,#f3cd74,#fff)":"background:rgba(255,255,255,.28)"})})));
  app.append(head);

  var form=h("div",{class:"card rise rise-1"}), nodes={};
  step.fields.forEach(function(f){
    var node;
    if(f[2]==="select"){
      node=h("select");node.append(new Option("Choose...",""));
      f[3].forEach(function(o){node.append(new Option(o,o))});
    } else {
      node=h("input",{type:f[2],placeholder:f[3]});
    }
    if(onboardDraft[f[0]]) node.value=onboardDraft[f[0]];
    if(f[0]==="track"){
      var qt=new URLSearchParams(location.search).get("track");
      if(!node.value&&(qt==="Beginner"||qt==="Masterclass")) node.value=qt;
    }
    nodes[f[0]]=node;
    form.append(h("label",{class:"field"},h("span",{class:"lbl",text:f[1]}),node));
  });

  var consent=null;
  if(onboardStep===STEPS.length-1){
    consent=h("input",{type:"checkbox"});
    if(onboardDraft.consent) consent.checked=true;
    form.append(h("label",{class:"check"},consent,
      h("span",{text:"I agree that Rehoteq Academy stores my name, phone and progress to run my training."})));
  }
  var msg=h("div",{class:"err"});form.append(msg);

  var go=h("button",{class:"btn block lg",style:"margin-top:4px"},
    onboardStep===STEPS.length-1?"Open my dashboard":"Continue →");
  go.onclick=function(){
    var k;
    for(k in nodes) onboardDraft[k]=String(nodes[k].value||"").trim();
    if(consent) onboardDraft.consent=consent.checked;

    if(onboardStep===0){
      if((onboardDraft.name||"").length<2){msg.textContent="Enter your full name.";return}
      onboardDraft.name=onboardDraft.name.slice(0,80);
      var ph=(onboardDraft.phone||"").replace(/[\s-]/g,"");
      if(!/^\+?\d{10,15}$/.test(ph)){msg.textContent="Enter a valid phone number, e.g. 08012345678.";return}
      onboardDraft.phone=ph;
    } else {
      for(var i=0;i<step.fields.length;i++){
        if(!onboardDraft[step.fields[i][0]]){msg.textContent="Please answer every question on this step.";return}
      }
    }
    if(onboardStep<STEPS.length-1){onboardStep++;showOnboarding();return}
    if(!consent.checked){msg.textContent="Please tick the agreement box to continue.";return}

    var v={name:onboardDraft.name,phone:onboardDraft.phone,track:onboardDraft.track,mode:onboardDraft.mode,
      device:onboardDraft.device,level:onboardDraft.level,goal:onboardDraft.goal,uid:user.uid,createdAt:Date.now()};
    profile=v;set("rc-profile",v);profDirty=true;set("rc-prof-d",true);
    pushProfile();
    toast("Welcome to Rehoteq Academy","ok");
    onboardStep=0;onboardDraft={};
    view="home";tab="learn";home();
  };
  form.append(go);
  if(onboardStep>0){
    form.append(h("button",{class:"btn quiet block",style:"margin-top:8px",
      onclick:function(){var k;for(k in nodes)onboardDraft[k]=String(nodes[k].value||"").trim();onboardStep--;showOnboarding()}},"← Back"));
  }
  app.append(form);
  app.append(h("p",{class:"faint center",style:"margin-top:16px",text:"One minute. Then everything is yours."}));
  land("Step "+(onboardStep+1)+" of "+STEPS.length);
}
